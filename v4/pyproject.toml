[project]
name = "tbode4"
version = "0.1.0"
description = "The v4 track: tbsim v4 (on Starsim v4) as agents compared with the same model as an ODE"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "sciris",
    "matplotlib",
    "starsim",
    "tbsim",
]

[dependency-groups]
dev = ["pytest", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Pinned to exact commits; bump them on purpose, and rerun the anchor test (tests/test_anchor.py) after each bump.
# tbsim: origin/v4 @ 619c296 (unreleased, "1.0.0 in development"). starsim: origin/v4 @ d83f4f87 (4.0.0rc4), which includes 6dcad9fd,
# Cliff's network fix (exp 25). The previous pins, for rerunning exps 12-25: starsim 80c81f53, tbsim dcfb522.
[tool.uv.sources]
starsim = { git = "https://github.com/starsimhub/starsim", rev = "d83f4f87b8cac3138e272cf2d955d02baca0c6e9" }
tbsim = { git = "https://github.com/starsimhub/tbsim", rev = "619c2963db9ee65990f4c5d23173e09d72c253dd" }
