[project]
name = "tbode4"
version = "0.1.0"
description = "The v4 track: tbsim v4 (on Starsim v4) as agents compared with the same model as an ODE"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "sciris",
    "matplotlib",
    "starsim",
    "tbsim",
]

[dependency-groups]
dev = ["pytest", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Pinned to exact commits; bump them on purpose, and rerun the anchor test (tests/test_anchor.py) after each bump.
# tbsim: origin/v4 @ a2ae583 ("fixes for rc5"). starsim: origin/v4 @ 0089ac0f (4.0.0rc5, the merge of PR #1625: Starsim's demography fixes; exp 33).
# Earlier pins: starsim d83f4f87 and tbsim 619c296 for exps 26-32; starsim 80c81f53 and tbsim dcfb522 for exps 12-25.
[tool.uv.sources]
starsim = { git = "https://github.com/starsimhub/starsim", rev = "0089ac0f14da63dcdcbebd84db86c2d4cd4f3f44" }
tbsim = { git = "https://github.com/starsimhub/tbsim", rev = "a2ae583fe152da893d2e96c4f9c7a3bf1cd36a9d" }
